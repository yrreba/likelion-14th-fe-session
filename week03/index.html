<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Perfect To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="todo-container">
        <h2>📝 To-Do List</h2>
        
        <div class="todo-stats">남은 할 일: <span id="todo-count">0</span>개</div>

        <div class="input-group">
            <input type="text" id="todo-input" placeholder="할 일을 입력하세요..." maxlength="30">
            <button id="add-btn">추가</button>
        </div>

        <ul id="todo-list"></ul>

        <button id="clear-all-btn">모두 비우기</button>
        
        <div id="message-box"></div> 
    </div>
    <script src="script.js"></script>
</body>
</html>
